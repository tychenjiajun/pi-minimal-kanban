<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pi-minimal-kanban social preview">
  <!-- GitHub social preview / shared link card (1200x630). -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0d12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="72" y="64" rx="8" width="238" height="48" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="191" y="97" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#c4b5fd">pi-extension</text>

  <text x="72" y="228" font-family="ui-monospace, Menlo, monospace" font-size="76" font-weight="700" fill="#ffffff">pi-minimal-kanban</text>
  <text x="74" y="292" font-family="system-ui, sans-serif" font-size="34" fill="#c9c9d4">A file-backed Kanban board for Pi agents</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="25" fill="#8b8b9e">
    <text x="74" y="360">◆ exclusive claims — one agent per task, force to take over</text>
    <text x="74" y="400">◆ workflows you declare in .pi/kanban/workflow.yaml</text>
    <text x="74" y="440">◆ tasks are Markdown you can diff and commit</text>
  </g>

  <rect x="72" y="496" rx="12" width="712" height="72" fill="#16161d" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="100" y="542" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#a78bfa">$ pi install npm:pi-minimal-kanban</text>

  <rect x="72" y="600" width="1056" height="8" rx="4" fill="url(#accent)"/>
</svg>
