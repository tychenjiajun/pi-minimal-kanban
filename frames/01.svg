<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="before: two agents take the same task">
  <rect width="1280" height="800" fill="#0d0d12"/>
  <rect x="48" y="40" rx="8" width="180" height="52" fill="#3a1d1d" stroke="#7f1d1d"/>
  <text x="138" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#fca5a5">before</text>
  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">two sessions, one task, no board</text>
  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="33" fill="#e6e6ef">
    <tspan x="96" dy="0" fill="#8b8b9e">coder-1 &gt; rewrite the store's lock</tspan>
    <tspan x="96" dy="1.5em" fill="#8b8b9e">coder-2 &gt; rewrite the store's lock</tspan>
    <tspan x="96" dy="2em" fill="#fca5a5">coder-1: opened a PR</tspan>
    <tspan x="96" dy="1.5em" fill="#fca5a5">coder-2: opened a PR (same work, twice)</tspan>
    <tspan x="96" dy="2em" fill="#6b6b7e">nobody knew who owned it — it lives in chat</tspan>
  </text>
</svg>
