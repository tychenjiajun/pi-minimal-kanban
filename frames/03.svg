<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="take over with a reason">
  <rect width="1280" height="800" fill="#0d0d12"/>
  <rect x="48" y="40" rx="8" width="230" height="52" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="163" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#c4b5fd">take over</text>
  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">force: true — and say why</text>
  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="33" fill="#e6e6ef">
    <tspan x="96" dy="0" fill="#a78bfa">kanban_assign { task: "T-0041", assignee: "coder-2",</tspan>
    <tspan x="96" dy="1.5em" fill="#a78bfa">                force: true, reason: "owner idle 2d" }</tspan>
    <tspan x="96" dy="2em" fill="#e6e6ef">T-0041  planning  rewrite the lock  @coder-2</tspan>
    <tspan x="96" dy="2em" fill="#6b6b7e">/kanban validate — a reason leaves nothing to warn about</tspan>
    <tspan x="96" dy="1.5em" fill="#86efac">Board is valid.</tspan>
    <tspan x="96" dy="2em" fill="#6b6b7e">without a reason, the same takeover is flagged, not fatal:</tspan>
    <tspan x="96" dy="1.5em" fill="#fbbf24">⚠ T-0041  unannotated_forced: ... has no reason.</tspan>
  </text>
</svg>
